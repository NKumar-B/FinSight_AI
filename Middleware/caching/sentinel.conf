# ==============================================================================
# FinSight AI - Redis Sentinel Configuration for High Availability (HA)
# ==============================================================================

port 26379
bind 0.0.0.0
protected-mode no

dir /tmp

sentinel monitor finsight-master redis 6379 2
sentinel down-after-milliseconds finsight-master 5000
sentinel failover-timeout finsight-master 10000
sentinel parallel-syncs finsight-master 1
