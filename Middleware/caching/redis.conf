# ==============================================================================
# FinSight AI - High-Performance Redis Caching & In-Memory Store Configuration
# ==============================================================================

# Network & Port
port 6379
bind 0.0.0.0
protected-mode yes

# Memory Management
maxmemory 512mb
maxmemory-policy volatile-lru

# Persistence (AOF for durability, RDB snapshotting for recovery)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

save 900 1
save 300 10
save 60 10000

# Security (Passphrase configured via environment or container secret)
# requirepass finsight_redis_secret_2026

# Timeout & Keepalive
timeout 300
tcp-keepalive 60

# Key TTL Guidelines for FinSight AI:
# - JWT Revocation Blacklist: 86400s (24h matching JWT lifetime)
# - 2FA OTP Codes: 300s (5 minutes)
# - Fraud Velocity Counters: 3600s (1h rolling window)
# - Accounts & Ledger Snapshot Cache: 60s
