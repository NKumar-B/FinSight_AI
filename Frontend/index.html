    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker registration: production/HTTPS or explicit PWA testing only
      if ('serviceWorker' in navigator) {
        const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const isExplicitPwa = window.location.search.includes('pwa=true');

        if (!isLocalhost || isExplicitPwa) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then((reg) => {
              console.log('FinSight PWA ServiceWorker registered with scope:', reg.scope);
            }).catch((err) => {
              console.log('FinSight PWA ServiceWorker skipped:', err);
            });
          });
        } else {
          // In local development, unregister any stale service workers to prevent Vite HMR/TSX fetch errors
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (const registration of registrations) {
              registration.unregister();
              console.log('Cleaned stale dev ServiceWorker for clean Vite reload');
            }
          });
        }
      }
    </script>
  </body>
